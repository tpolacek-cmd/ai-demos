<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Portal de Pagos</title>
    <link rel="stylesheet" href="config/variables.css">
    <link rel="stylesheet" href="css/index-styles.css">
    <script src="config/brand-config.js"></script>
    <script src="config/demo-builder-config.js"></script>
    <script src="js/demo-router.js"></script>
</head>
<body>
    <header class="header">
        <!-- BRAND: company logo -->
        <img id="indexLogo" src="" alt="Logo">
        <div class="header-divider"></div>
        <div>
            <h1>Demo Portal de Pagos</h1>
            <p>Arma tu demo seleccionando una opcion por cada etapa</p>
        </div>
    </header>

    <main class="main">
        <div class="view-mode-bar">
            <p class="section-title">Configurar demo</p>
            <div class="view-mode-toggle" id="viewModeToggle">
                <button class="view-mode-btn active" data-mode="desktop" id="btnDesktop">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="3" width="20" height="14" rx="2"/>
                        <path d="M8 21h8M12 17v4"/>
                    </svg>
                    Desktop
                </button>
                <button class="view-mode-btn" data-mode="mobile" id="btnMobile">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="5" y="2" width="14" height="20" rx="2"/>
                        <path d="M12 18h.01"/>
                    </svg>
                    Mobile
                </button>
            </div>
        </div>

        <!-- Builder de 3 columnas — se genera dinamicamente desde DEMO_STAGES -->
        <div class="builder-grid" id="builderGrid"></div>

        <!-- Barra de resumen + boton iniciar -->
        <div class="builder-summary" id="builderSummary">
            <div class="summary-flow" id="summaryFlow"></div>
            <button class="btn-start" id="startDemo">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                Iniciar Demo
            </button>
        </div>
    </main>

    <footer class="footer">
        Demo de portal de pagos <span data-brand="name"></span> &mdash; Solo para fines de presentacion
    </footer>

    <script>
        // ============================================
        // BRAND: Initialize brand elements
        // ============================================
        (function initIndexBrand() {
            document.title = BRAND.name + ' - Demo Portal de Pagos';
            var logo = document.getElementById('indexLogo');
            if (logo) { logo.src = BRAND.logo; logo.alt = BRAND.name; }
            document.querySelectorAll('[data-brand="name"]').forEach(function(el) {
                el.textContent = BRAND.name;
            });
        })();

        // ============================================
        // BUILDER: Generate columns from DEMO_STAGES
        // ============================================
        (function initBuilder() {
            var builderGrid = document.getElementById('builderGrid');
            var summaryFlow = document.getElementById('summaryFlow');
            var startBtn = document.getElementById('startDemo');
            var btnDesktop = document.getElementById('btnDesktop');
            var btnMobile = document.getElementById('btnMobile');
            var currentMode = sessionStorage.getItem('viewMode') || 'desktop';

            // Build columns
            DEMO_STAGES.forEach(function(stage, stageIndex) {
                var column = document.createElement('div');
                column.className = 'builder-column';
                column.setAttribute('data-stage', stage.id);

                // Stage header
                var header = document.createElement('div');
                header.className = 'stage-header';
                header.innerHTML =
                    '<div class="stage-number-row">' +
                        '<span class="stage-icon">' + stage.icon + '</span>' +
                        '<span class="stage-number">Paso ' + (stageIndex + 1) + '</span>' +
                    '</div>' +
                    '<h3>' + stage.label + '</h3>' +
                    '<p>' + stage.description + '</p>';
                column.appendChild(header);

                // Options container
                var optionsContainer = document.createElement('div');
                optionsContainer.className = 'stage-options';

                stage.options.forEach(function(option, optIndex) {
                    var isDefault = optIndex === 0;
                    var label = document.createElement('label');
                    label.className = 'option-card' + (isDefault ? ' selected' : '');
                    label.setAttribute('data-option', option.id);
                    label.setAttribute('data-stage', stage.id);

                    // Check if this option has mobile restriction
                    if (option.mobileSupported === false) {
                        label.setAttribute('data-mobile-supported', 'false');
                    }

                    label.innerHTML =
                        '<input type="radio" name="stage-' + stage.id + '" value="' + option.id + '"' + (isDefault ? ' checked' : '') + '>' +
                        '<span class="option-icon">' + option.icon + '</span>' +
                        '<span class="option-info">' +
                            '<strong>' + option.name + '</strong>' +
                            '<span>' + option.description + '</span>' +
                        '</span>' +
                        '<span class="option-check">' +
                            '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' +
                        '</span>';

                    optionsContainer.appendChild(label);
                });

                column.appendChild(optionsContainer);
                builderGrid.appendChild(column);
            });

            // Arrow separators between columns
            var columns = builderGrid.querySelectorAll('.builder-column');
            for (var i = 0; i < columns.length - 1; i++) {
                var arrow = document.createElement('div');
                arrow.className = 'builder-arrow';
                arrow.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l6 7-6 7"/></svg>';
                // Insert arrow after current column
                columns[i].after(arrow);
            }

            // ============================================
            // SELECTION LOGIC
            // ============================================
            builderGrid.addEventListener('change', function(e) {
                if (e.target.type !== 'radio') return;

                var stageId = e.target.name.replace('stage-', '');
                var optionId = e.target.value;

                // If the payment stage is locked, revert the change
                if (stageId === 'payment') {
                    var card = builderGrid.querySelector('.option-card[data-stage="payment"][data-option="' + optionId + '"]');
                    if (card && card.classList.contains('locked')) {
                        // Re-select the currently forced option
                        var currentlySelected = builderGrid.querySelector('.option-card[data-stage="payment"].selected');
                        if (currentlySelected) {
                            var forcedRadio = currentlySelected.querySelector('input[type="radio"]');
                            if (forcedRadio) forcedRadio.checked = true;
                        }
                        return;
                    }
                }

                // Update selected class
                var stageCards = builderGrid.querySelectorAll('.option-card[data-stage="' + stageId + '"]');
                stageCards.forEach(function(card) {
                    card.classList.toggle('selected', card.getAttribute('data-option') === optionId);
                });

                updateSummary();
                updateMobileRestrictions();
                updateForcedPayment();
            });

            // ============================================
            // SUMMARY BAR
            // ============================================
            function updateSummary() {
                var parts = [];
                DEMO_STAGES.forEach(function(stage) {
                    var selected = builderGrid.querySelector('input[name="stage-' + stage.id + '"]:checked');
                    if (selected) {
                        var option = getOptionById(stage.id, selected.value);
                        if (option) parts.push(option.name);
                    }
                });

                summaryFlow.innerHTML = parts.map(function(name, i) {
                    var html = '<span class="summary-step">' + name + '</span>';
                    if (i < parts.length - 1) {
                        html += '<span class="summary-arrow"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l6 7-6 7"/></svg></span>';
                    }
                    return html;
                }).join('');
            }

            // ============================================
            // VIEW MODE: Desktop / Mobile toggle
            // ============================================
            function applyMode(mode) {
                currentMode = mode;
                sessionStorage.setItem('viewMode', mode);
                btnDesktop.classList.toggle('active', mode === 'desktop');
                btnMobile.classList.toggle('active', mode === 'mobile');
                updateMobileRestrictions();
            }

            function updateMobileRestrictions() {
                var mobileCards = builderGrid.querySelectorAll('.option-card[data-mobile-supported="false"]');

                mobileCards.forEach(function(card) {
                    if (currentMode === 'mobile') {
                        card.classList.add('disabled');
                        var radio = card.querySelector('input[type="radio"]');
                        // If the disabled option is currently selected, switch to first available
                        if (radio && radio.checked) {
                            var stageId = card.getAttribute('data-stage');
                            var firstAvailable = builderGrid.querySelector('.option-card[data-stage="' + stageId + '"]:not(.disabled) input[type="radio"]');
                            if (firstAvailable) {
                                firstAvailable.checked = true;
                                firstAvailable.dispatchEvent(new Event('change', { bubbles: true }));
                            }
                        }
                    } else {
                        card.classList.remove('disabled');
                    }
                });

                // Update start button state
                var arrivalSelected = builderGrid.querySelector('input[name="stage-arrival"]:checked');
                if (arrivalSelected && currentMode === 'mobile') {
                    var option = getOptionById('arrival', arrivalSelected.value);
                    if (option && option.mobileSupported === false) {
                        startBtn.disabled = true;
                        startBtn.title = 'La opcion seleccionada no esta disponible en modo mobile';
                        return;
                    }
                }
                startBtn.disabled = false;
                startBtn.title = '';
            }

            // ============================================
            // FORCED PAYMENT: Lock payment when checkout requires it
            // ============================================
            function updateForcedPayment() {
                var checkoutSelected = builderGrid.querySelector('input[name="stage-checkout"]:checked');
                if (!checkoutSelected) return;

                var checkoutOption = getOptionById('checkout', checkoutSelected.value);
                var paymentCards = builderGrid.querySelectorAll('.option-card[data-stage="payment"]');
                var paymentColumn = builderGrid.querySelector('.builder-column[data-stage="payment"]');

                if (checkoutOption && checkoutOption.forcedPayment) {
                    // Force-select the linked payment option
                    var forcedRadio = builderGrid.querySelector('input[name="stage-payment"][value="' + checkoutOption.forcedPayment + '"]');
                    if (forcedRadio && !forcedRadio.checked) {
                        forcedRadio.checked = true;
                        // Update selection visuals
                        paymentCards.forEach(function(card) {
                            card.classList.toggle('selected', card.getAttribute('data-option') === checkoutOption.forcedPayment);
                        });
                    }
                    // Disable all payment cards (locked to this choice)
                    paymentCards.forEach(function(card) {
                        card.classList.add('locked');
                    });
                    // Add a "linked" badge to the payment column
                    if (paymentColumn && !paymentColumn.querySelector('.locked-badge')) {
                        var badge = document.createElement('div');
                        badge.className = 'locked-badge';
                        badge.textContent = 'Vinculado al portal seleccionado';
                        paymentColumn.querySelector('.stage-header').appendChild(badge);
                    }
                } else {
                    // Restore free selection
                    paymentCards.forEach(function(card) {
                        card.classList.remove('locked');
                    });
                    // Remove locked badge
                    var badge = paymentColumn && paymentColumn.querySelector('.locked-badge');
                    if (badge) badge.remove();
                }

                updateSummary();
            }

            btnDesktop.addEventListener('click', function() { applyMode('desktop'); });
            btnMobile.addEventListener('click', function() { applyMode('mobile'); });

            // ============================================
            // START DEMO
            // ============================================
            startBtn.addEventListener('click', function() {
                if (startBtn.disabled) return;

                // Read selections
                var config = {};
                DEMO_STAGES.forEach(function(stage) {
                    var selected = builderGrid.querySelector('input[name="stage-' + stage.id + '"]:checked');
                    config[stage.id] = selected ? selected.value : stage.options[0].id;
                });

                // Save config for other pages to read
                saveDemoConfig(config);

                // Navigate to the first page of the flow
                var startUrl = getDemoStartUrl(currentMode);
                if (!startUrl) {
                    alert('Esta combinacion no esta disponible en modo mobile');
                    return;
                }
                window.location.href = startUrl;
            });

            // ============================================
            // INIT
            // ============================================
            applyMode(currentMode);
            updateSummary();
            updateForcedPayment();
        })();
    </script>
</body>
</html>
