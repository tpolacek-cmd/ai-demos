<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Portal de Pagos</title>
    <link rel="stylesheet" href="config/variables.css">
    <link rel="stylesheet" href="css/index-styles.css">
    <script src="config/brand-config.js"></script>
    <script src="js/brand-override.js"></script>
    <script src="config/demo-builder-config.js"></script>
    <script src="config/facturas-config.js"></script>
    <script src="js/demo-router.js"></script>
</head>
<body>
    <header class="header">
        <!-- BRAND: company logo -->
        <img id="indexLogo" src="" alt="Logo">
        <div class="header-divider"></div>
        <div>
            <h1>Demo Portal de Pagos</h1>
            <p>Arma tu demo seleccionando una opcion por cada etapa</p>
        </div>
    </header>

    <main class="main">
        <div class="view-mode-bar">
            <p class="section-title">Configurar demo</p>
            <div class="view-mode-toggle" id="viewModeToggle">
                <button class="view-mode-btn active" data-mode="desktop" id="btnDesktop">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="3" width="20" height="14" rx="2"/>
                        <path d="M8 21h8M12 17v4"/>
                    </svg>
                    Desktop
                </button>
                <button class="view-mode-btn" data-mode="mobile" id="btnMobile">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="5" y="2" width="14" height="20" rx="2"/>
                        <path d="M12 18h.01"/>
                    </svg>
                    Mobile
                </button>
            </div>
        </div>

        <!-- Brand Editor Panel -->
        <div class="brand-editor" id="brandEditor">
            <button class="brand-editor-toggle" id="brandEditorToggle">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                <span>Personalizar marca</span>
                <span class="brand-editor-badge" id="brandEditorBadge" style="display:none">Modificada</span>
                <svg class="brand-editor-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </button>

            <div class="brand-editor-body" id="brandEditorBody">
                <!-- Preset selector bar -->
                <div class="brand-presets-bar" id="brandPresetsBar">
                    <label class="brand-presets-label">Preset:</label>
                    <select class="brand-presets-select" id="brandPresetSelect">
                        <option value="">Default (brand-config.js)</option>
                    </select>
                    <button class="brand-btn brand-btn-secondary brand-btn-sm" id="brandPresetSaveAs">
                        Guardar como...
                    </button>
                    <button class="brand-btn brand-btn-secondary brand-btn-sm brand-btn-danger" id="brandPresetDelete" style="display:none">
                        Eliminar
                    </button>
                </div>

                <!-- Tabs de secciones -->
                <div class="brand-editor-tabs" id="brandEditorTabs">
                    <button class="brand-tab active" data-tab="identity">Identidad</button>
                    <button class="brand-tab" data-tab="contact">Contacto</button>
                    <button class="brand-tab" data-tab="account">Cuenta</button>
                    <button class="brand-tab" data-tab="colors">Colores</button>
                </div>

                <!-- Tab: Identidad -->
                <div class="brand-tab-content active" data-tab="identity">
                    <div class="brand-field">
                        <label>Nombre de la empresa</label>
                        <input type="text" data-brand="name" placeholder="Ej: Totalplay">
                    </div>
                    <div class="brand-field">
                        <label>Nombre completo</label>
                        <input type="text" data-brand="fullName" placeholder="Ej: Totalplay Telecomunicaciones">
                    </div>
                    <div class="brand-field">
                        <label>Tipo de servicio</label>
                        <input type="text" data-brand="serviceType" placeholder="Ej: Telecomunicaciones">
                    </div>
                    <div class="brand-field">
                        <label>Nombre del plan</label>
                        <input type="text" data-brand="planName" placeholder="Ej: Plan Hogar 200 Mbps">
                    </div>
                    <div class="brand-field">
                        <label>Logo</label>
                        <div class="brand-logo-picker">
                            <div class="brand-logo-preview" id="brandLogoPreview" aria-hidden="true"></div>
                            <div class="brand-logo-picker-main">
                                <button type="button" class="brand-logo-btn" id="brandLogoBtn">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                                    Elegir imagen…
                                </button>
                                <span class="brand-logo-name" id="brandLogoName">Ninguna imagen</span>
                            </div>
                            <input type="file" id="brandLogoFile" accept="image/png,image/jpeg,image/svg+xml,image/webp" hidden>
                            <input type="hidden" data-brand="logo" id="brandLogoValue">
                        </div>
                        <p class="brand-logo-hint">Buscá el logo en tu compu (PNG, JPG o SVG). Se incrusta en la demo, no hace falta ninguna ruta.</p>
                    </div>
                </div>

                <!-- Tab: Contacto -->
                <div class="brand-tab-content" data-tab="contact">
                    <div class="brand-field">
                        <label>Dominio</label>
                        <input type="text" data-brand="domain" placeholder="Ej: totalplay.com.mx">
                    </div>
                    <div class="brand-field">
                        <label>Dominio de pago</label>
                        <input type="text" data-brand="paymentDomain" placeholder="Ej: pago.totalplay.com.mx">
                    </div>
                    <div class="brand-field">
                        <label>Telefono</label>
                        <input type="text" data-brand="phone" placeholder="Ej: 800 123 4567">
                    </div>
                    <div class="brand-field">
                        <label>Telefono amigable</label>
                        <input type="text" data-brand="phoneFriendly" placeholder="Ej: 800 TOTALPLAY">
                    </div>
                    <div class="brand-field">
                        <label>WhatsApp</label>
                        <input type="text" data-brand="whatsapp" placeholder="Ej: 55 1234 5678">
                    </div>
                    <div class="brand-field">
                        <label>Deep link param</label>
                        <input type="text" data-brand="deepLinkServiceParam" placeholder="Ej: totalplay">
                    </div>
                </div>

                <!-- Tab: Cuenta / Factura -->
                <div class="brand-tab-content" data-tab="account">
                    <div class="brand-field">
                        <label>Numero de cuenta</label>
                        <input type="text" data-brand="account.number" placeholder="0073-4120-58">
                    </div>
                    <div class="brand-field">
                        <label>Periodo</label>
                        <input type="text" data-brand="account.period" placeholder="01 Mar - 31 Mar 2026">
                    </div>
                    <div class="brand-field">
                        <label>Fecha de vencimiento</label>
                        <input type="text" data-brand="account.dueDate" placeholder="20 de Marzo 2026">
                    </div>
                    <div class="brand-field">
                        <label>Fecha vencimiento corta</label>
                        <input type="text" data-brand="account.dueDateShort" placeholder="20 Mar 2026">
                    </div>
                    <div class="brand-field brand-field-row">
                        <div class="brand-field">
                            <label>Monto del plan</label>
                            <input type="number" step="0.01" data-brand="account.planAmount" placeholder="405.00">
                        </div>
                        <div class="brand-field">
                            <label>Descuento</label>
                            <input type="number" step="0.01" data-brand="account.discount" placeholder="-30.00">
                        </div>
                    </div>
                    <div class="brand-field">
                        <label>Etiqueta del descuento</label>
                        <input type="text" data-brand="account.discountLabel" placeholder="Descuento pronto pago">
                    </div>
                    <div class="brand-field brand-field-row">
                        <div class="brand-field">
                            <label>Saldo anterior</label>
                            <input type="number" step="0.01" data-brand="account.previousBalance" placeholder="0.00">
                        </div>
                        <div class="brand-field">
                            <label>Total a pagar</label>
                            <input type="number" step="0.01" data-brand="account.totalAmount" placeholder="375.00">
                        </div>
                    </div>
                    <div class="brand-field">
                        <label>Referencia de pago</label>
                        <input type="text" data-brand="account.reference" placeholder="0073 0001 4120 5800 7">
                    </div>
                </div>

                <!-- Tab: Colores -->
                <div class="brand-tab-content" data-tab="colors">
                    <div class="brand-field brand-field-color">
                        <label>Color primario</label>
                        <div class="color-input-group">
                            <input type="color" data-brand="colors.primary" data-color-for="colors-primary-hex">
                            <input type="text" id="colors-primary-hex" data-brand="colors.primary" placeholder="#0077B6">
                        </div>
                    </div>
                    <div class="brand-field brand-field-color">
                        <label>Color primario oscuro</label>
                        <div class="color-input-group">
                            <input type="color" data-brand="colors.primaryDark" data-color-for="colors-primaryDark-hex">
                            <input type="text" id="colors-primaryDark-hex" data-brand="colors.primaryDark" placeholder="#005F8A">
                        </div>
                    </div>
                    <div class="brand-field brand-field-color">
                        <label>Color primario claro</label>
                        <div class="color-input-group">
                            <input type="color" data-brand="colors.primaryLight" data-color-for="colors-primaryLight-hex">
                            <input type="text" id="colors-primaryLight-hex" data-brand="colors.primaryLight" placeholder="#E6F4FA">
                        </div>
                    </div>
                    <div class="brand-field brand-field-color">
                        <label>Color accent</label>
                        <div class="color-input-group">
                            <input type="color" data-brand="colors.accent" data-color-for="colors-accent-hex">
                            <input type="text" id="colors-accent-hex" data-brand="colors.accent" placeholder="#00A5CF">
                        </div>
                    </div>
                    <div class="brand-field brand-field-color">
                        <label>Fondo</label>
                        <div class="color-input-group">
                            <input type="color" data-brand="colors.background" data-color-for="colors-background-hex">
                            <input type="text" id="colors-background-hex" data-brand="colors.background" placeholder="#F0F8FF">
                        </div>
                    </div>
                    <div class="brand-field brand-field-color">
                        <label>Header</label>
                        <div class="color-input-group">
                            <input type="color" data-brand="colors.headerBg" data-color-for="colors-headerBg-hex">
                            <input type="text" id="colors-headerBg-hex" data-brand="colors.headerBg" placeholder="#2A3444">
                        </div>
                    </div>
                    <div class="brand-field brand-field-color">
                        <label>Texto de botones</label>
                        <div class="color-input-group">
                            <input type="color" data-brand="colors.btnText" data-color-for="colors-btnText-hex">
                            <input type="text" id="colors-btnText-hex" data-brand="colors.btnText" placeholder="#ffffff">
                        </div>
                    </div>
                </div>

                <!-- Barra de acciones -->
                <div class="brand-editor-actions">
                    <button class="brand-btn brand-btn-secondary" id="brandReset">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                        Resetear
                    </button>
                    <button class="brand-btn brand-btn-secondary" id="brandExport">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        Exportar JSON
                    </button>
                    <button class="brand-btn brand-btn-secondary" id="brandImport">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                        Importar JSON
                    </button>
                    <button class="brand-btn brand-btn-primary" id="brandSave">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                        Guardar cambios
                    </button>
                </div>
            </div>
        </div>

        <!-- Input file oculto para importar JSON -->
        <input type="file" id="brandImportFile" accept=".json" style="display:none">

        <!-- Builder de 3 columnas — se genera dinamicamente desde DEMO_STAGES -->
        <div class="builder-grid" id="builderGrid"></div>

        <!-- Barra de resumen + boton iniciar -->
        <div class="builder-summary" id="builderSummary">
            <div class="summary-flow" id="summaryFlow"></div>
            <button class="btn-start" id="startDemo">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                Iniciar Demo
            </button>
        </div>
    </main>

    <footer class="footer">
        Demo de portal de pagos <span data-brand="name"></span> &mdash; Solo para fines de presentacion
    </footer>

    <script>
        // ============================================
        // BRAND: Initialize brand elements
        // ============================================
        (function initIndexBrand() {
            document.title = BRAND.name + ' - Demo Portal de Pagos';
            var logo = document.getElementById('indexLogo');
            if (logo) { logo.src = BRAND.logo; logo.alt = BRAND.name; }
            document.querySelectorAll('[data-brand="name"]').forEach(function(el) {
                el.textContent = BRAND.name;
            });
        })();

        // ============================================
        // BUILDER: Generate columns from DEMO_STAGES
        // ============================================
        (function initBuilder() {
            var builderGrid = document.getElementById('builderGrid');
            var summaryFlow = document.getElementById('summaryFlow');
            var startBtn = document.getElementById('startDemo');
            var btnDesktop = document.getElementById('btnDesktop');
            var btnMobile = document.getElementById('btnMobile');
            var currentMode = sessionStorage.getItem('viewMode') || 'desktop';

            // Build columns
            DEMO_STAGES.forEach(function(stage, stageIndex) {
                var column = document.createElement('div');
                column.className = 'builder-column';
                column.setAttribute('data-stage', stage.id);

                // Stage header
                var header = document.createElement('div');
                header.className = 'stage-header';
                header.innerHTML =
                    '<div class="stage-number-row">' +
                        '<span class="stage-icon">' + stage.icon + '</span>' +
                        '<span class="stage-number">Paso ' + (stageIndex + 1) + '</span>' +
                    '</div>' +
                    '<h3>' + stage.label + '</h3>' +
                    '<p>' + stage.description + '</p>';
                column.appendChild(header);

                // Options container
                var optionsContainer = document.createElement('div');
                optionsContainer.className = 'stage-options';

                var isMulti = !!stage.multiSelect;
                stage.options.forEach(function(option, optIndex) {
                    // Multi-select (Paso 3): todos los metodos marcados por default. Single: solo el primero.
                    var checked = isMulti ? true : (optIndex === 0);
                    var label = document.createElement('label');
                    label.className = 'option-card' + (checked ? ' selected' : '');
                    label.setAttribute('data-option', option.id);
                    label.setAttribute('data-stage', stage.id);

                    // Check if this option has mobile restriction
                    if (option.mobileSupported === false) {
                        label.setAttribute('data-mobile-supported', 'false');
                    }

                    label.innerHTML =
                        '<input type="' + (isMulti ? 'checkbox' : 'radio') + '" name="stage-' + stage.id + '" value="' + option.id + '"' + (checked ? ' checked' : '') + '>' +
                        '<span class="option-icon">' + option.icon + '</span>' +
                        '<span class="option-info">' +
                            '<strong>' + option.name + '</strong>' +
                            '<span>' + option.description + '</span>' +
                        '</span>' +
                        '<span class="option-check">' +
                            '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' +
                        '</span>';

                    optionsContainer.appendChild(label);
                });

                // Selector de marca de factura (solo etapa arrival; visible al elegir "QR en Factura")
                if (stage.id === 'arrival' && typeof FACTURAS !== 'undefined' && FACTURAS.length) {
                    var facturaPicker = document.createElement('div');
                    facturaPicker.id = 'facturaPicker';
                    facturaPicker.style.cssText = 'display:none;margin-top:10px;padding:14px;border:1px solid var(--tp-border,#e2e8f0);border-radius:12px;background:#f8fafc;';
                    var facturaOpts = FACTURAS.map(function(f) {
                        return '<option value="' + f.id + '">' + f.label + '</option>';
                    }).join('');
                    facturaPicker.innerHTML =
                        '<label for="builderFacturaSelect" style="display:block;font-size:13px;font-weight:700;color:var(--tp-text,#1a1a2e);margin-bottom:6px;">Marca de la factura</label>' +
                        '<select id="builderFacturaSelect" style="width:100%;font-family:inherit;font-size:14px;font-weight:600;color:var(--tp-text,#1a1a2e);background:#fff;border:1px solid var(--tp-border,#e2e8f0);border-radius:8px;padding:9px 12px;cursor:pointer;">' + facturaOpts + '</select>' +
                        '<p style="font-size:12px;color:var(--tp-text-secondary,#6c757d);margin:8px 0 0;">El QR de esta factura lleva al portal + pago que elijas en los Pasos 2 y 3.</p>';
                    // Insertar el selector justo debajo del card "Factura QR con marca"
                    var qrCard = optionsContainer.querySelector('.option-card[data-option="qr"]');
                    if (qrCard) { qrCard.after(facturaPicker); } else { optionsContainer.appendChild(facturaPicker); }
                }

                column.appendChild(optionsContainer);
                builderGrid.appendChild(column);
            });

            // Arrow separators between columns
            var columns = builderGrid.querySelectorAll('.builder-column');
            for (var i = 0; i < columns.length - 1; i++) {
                var arrow = document.createElement('div');
                arrow.className = 'builder-arrow';
                arrow.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l6 7-6 7"/></svg>';
                // Insert arrow after current column
                columns[i].after(arrow);
            }

            // ============================================
            // SELECTION LOGIC
            // ============================================
            builderGrid.addEventListener('change', function(e) {
                if (e.target.type !== 'radio' && e.target.type !== 'checkbox') return;

                var stageId = e.target.name.replace('stage-', '');
                var optionId = e.target.value;

                // Multi-select (Paso 3 metodos): toggle individual, sin deseleccionar el resto
                if (e.target.type === 'checkbox') {
                    var mcard = builderGrid.querySelector('.option-card[data-stage="' + stageId + '"][data-option="' + optionId + '"]');
                    if (mcard) mcard.classList.toggle('selected', e.target.checked);
                    // Garantizar al menos un metodo marcado
                    if (!builderGrid.querySelectorAll('input[name="stage-' + stageId + '"]:checked').length) {
                        e.target.checked = true;
                        if (mcard) mcard.classList.add('selected');
                    }
                    updateSummary();
                    return;
                }

                // If the stage is locked (by forcedPayment or group locking), revert the change
                var card = builderGrid.querySelector('.option-card[data-stage="' + stageId + '"][data-option="' + optionId + '"]');
                if (card && card.classList.contains('locked')) {
                    // Re-select the currently forced option
                    var currentlySelected = builderGrid.querySelector('.option-card[data-stage="' + stageId + '"].selected');
                    if (currentlySelected) {
                        var forcedRadio = currentlySelected.querySelector('input[type="radio"]');
                        if (forcedRadio) forcedRadio.checked = true;
                    }
                    return;
                }

                // Update selected class
                var stageCards = builderGrid.querySelectorAll('.option-card[data-stage="' + stageId + '"]');
                stageCards.forEach(function(card) {
                    card.classList.toggle('selected', card.getAttribute('data-option') === optionId);
                });

                // Mostrar el selector de marca de factura solo si el arrival es "QR en Factura"
                var facturaPickerEl = document.getElementById('facturaPicker');
                if (facturaPickerEl) {
                    var arrChecked = builderGrid.querySelector('input[name="stage-arrival"]:checked');
                    facturaPickerEl.style.display = (arrChecked && arrChecked.value === 'qr') ? 'block' : 'none';
                }

                updateSummary();
                updateMobileRestrictions();
                updateForcedPayment();
                updateGroupLocking();
            });

            // ============================================
            // SUMMARY BAR
            // ============================================
            function updateSummary() {
                var parts = [];
                DEMO_STAGES.forEach(function(stage) {
                    if (stage.multiSelect) {
                        var checked = builderGrid.querySelectorAll('input[name="stage-' + stage.id + '"]:checked');
                        if (checked.length === 1) {
                            var opt1 = getOptionById(stage.id, checked[0].value);
                            parts.push(opt1 ? opt1.name : '1 metodo');
                        } else if (checked.length > 1) {
                            parts.push(checked.length + ' metodos');
                        }
                        return;
                    }
                    var selected = builderGrid.querySelector('input[name="stage-' + stage.id + '"]:checked');
                    if (selected) {
                        var option = getOptionById(stage.id, selected.value);
                        if (option) parts.push(option.name);
                    }
                });

                summaryFlow.innerHTML = parts.map(function(name, i) {
                    var html = '<span class="summary-step">' + name + '</span>';
                    if (i < parts.length - 1) {
                        html += '<span class="summary-arrow"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l6 7-6 7"/></svg></span>';
                    }
                    return html;
                }).join('');
            }

            // ============================================
            // VIEW MODE: Desktop / Mobile toggle
            // ============================================
            function applyMode(mode) {
                currentMode = mode;
                sessionStorage.setItem('viewMode', mode);
                btnDesktop.classList.toggle('active', mode === 'desktop');
                btnMobile.classList.toggle('active', mode === 'mobile');
                updateMobileRestrictions();
            }

            function updateMobileRestrictions() {
                var mobileCards = builderGrid.querySelectorAll('.option-card[data-mobile-supported="false"]');

                mobileCards.forEach(function(card) {
                    if (currentMode === 'mobile') {
                        card.classList.add('disabled');
                        var radio = card.querySelector('input[type="radio"]');
                        // If the disabled option is currently selected, switch to first available
                        if (radio && radio.checked) {
                            var stageId = card.getAttribute('data-stage');
                            var firstAvailable = builderGrid.querySelector('.option-card[data-stage="' + stageId + '"]:not(.disabled) input[type="radio"]');
                            if (firstAvailable) {
                                firstAvailable.checked = true;
                                firstAvailable.dispatchEvent(new Event('change', { bubbles: true }));
                            }
                        }
                    } else {
                        card.classList.remove('disabled');
                    }
                });

                // Update start button state
                var arrivalSelected = builderGrid.querySelector('input[name="stage-arrival"]:checked');
                if (arrivalSelected && currentMode === 'mobile') {
                    var option = getOptionById('arrival', arrivalSelected.value);
                    if (option && option.mobileSupported === false) {
                        startBtn.disabled = true;
                        startBtn.title = 'La opcion seleccionada no esta disponible en modo mobile';
                        return;
                    }
                }
                startBtn.disabled = false;
                startBtn.title = '';
            }

            // ============================================
            // FORCED PAYMENT: Lock payment when checkout requires it
            // ============================================
            function updateForcedPayment() {
                var checkoutSelected = builderGrid.querySelector('input[name="stage-checkout"]:checked');
                if (!checkoutSelected) return;

                var checkoutOption = getOptionById('checkout', checkoutSelected.value);
                var paymentCards = builderGrid.querySelectorAll('.option-card[data-stage="payment"]');
                var paymentColumn = builderGrid.querySelector('.builder-column[data-stage="payment"]');

                if (checkoutOption && checkoutOption.forcedPayment) {
                    // Force-select the linked payment option
                    var forcedRadio = builderGrid.querySelector('input[name="stage-payment"][value="' + checkoutOption.forcedPayment + '"]');
                    if (forcedRadio && !forcedRadio.checked) {
                        forcedRadio.checked = true;
                        // Update selection visuals
                        paymentCards.forEach(function(card) {
                            card.classList.toggle('selected', card.getAttribute('data-option') === checkoutOption.forcedPayment);
                        });
                    }
                    // Disable all payment cards (locked to this choice)
                    paymentCards.forEach(function(card) {
                        card.classList.add('locked');
                    });
                    // Add a "linked" badge to the payment column
                    if (paymentColumn && !paymentColumn.querySelector('.forced-payment-badge')) {
                        var badge = document.createElement('div');
                        badge.className = 'locked-badge forced-payment-badge';
                        badge.textContent = 'Vinculado al portal seleccionado';
                        paymentColumn.querySelector('.stage-header').appendChild(badge);
                    }
                } else {
                    // Restore free selection
                    paymentCards.forEach(function(card) {
                        card.classList.remove('locked');
                    });
                    // Remove locked badge
                    var badge = paymentColumn && paymentColumn.querySelector('.forced-payment-badge');
                    if (badge) badge.remove();
                }

                updateSummary();
            }

            // ============================================
            // GROUP LOCKING: Lock linked stages when a group option is selected
            // ============================================
            function updateGroupLocking() {
                // Find the active group (if any) from current selections
                var activeGroup = null;
                var sourceStageId = null;

                DEMO_STAGES.forEach(function(stage) {
                    var selected = builderGrid.querySelector('input[name="stage-' + stage.id + '"]:checked');
                    if (selected) {
                        var option = getOptionById(stage.id, selected.value);
                        if (option && option.group) {
                            activeGroup = option.group;
                            sourceStageId = stage.id;
                        }
                    }
                });

                if (activeGroup) {
                    // Force-select matching group options in other stages and lock them
                    DEMO_STAGES.forEach(function(stage) {
                        if (stage.id === sourceStageId) return;

                        // Find the option in this stage that belongs to the same group
                        var groupOption = null;
                        stage.options.forEach(function(opt) {
                            if (opt.group === activeGroup) groupOption = opt;
                        });

                        if (!groupOption) return;

                        var stageCards = builderGrid.querySelectorAll('.option-card[data-stage="' + stage.id + '"]');
                        var column = builderGrid.querySelector('.builder-column[data-stage="' + stage.id + '"]');

                        // Force-select the group option
                        var groupRadio = builderGrid.querySelector('input[name="stage-' + stage.id + '"][value="' + groupOption.id + '"]');
                        if (groupRadio && !groupRadio.checked) {
                            groupRadio.checked = true;
                            stageCards.forEach(function(card) {
                                card.classList.toggle('selected', card.getAttribute('data-option') === groupOption.id);
                            });
                        }

                        // Lock all cards in this stage
                        stageCards.forEach(function(card) {
                            card.classList.add('locked');
                        });

                        // Add "Demo vinculada" badge if not present
                        if (column && !column.querySelector('.group-locked-badge')) {
                            var badge = document.createElement('div');
                            badge.className = 'locked-badge group-locked-badge';
                            badge.textContent = 'Demo vinculada';
                            column.querySelector('.stage-header').appendChild(badge);
                        }
                    });
                } else {
                    // No group active — remove group locking from all stages
                    DEMO_STAGES.forEach(function(stage) {
                        var stageCards = builderGrid.querySelectorAll('.option-card[data-stage="' + stage.id + '"]');
                        var column = builderGrid.querySelector('.builder-column[data-stage="' + stage.id + '"]');

                        // Only remove .locked if it was set by group locking (not by forcedPayment)
                        // Check if forcedPayment is active for this stage
                        var checkoutSelected = builderGrid.querySelector('input[name="stage-checkout"]:checked');
                        var checkoutOption = checkoutSelected ? getOptionById('checkout', checkoutSelected.value) : null;
                        var isForcedByPayment = stage.id === 'payment' && checkoutOption && checkoutOption.forcedPayment;

                        if (!isForcedByPayment) {
                            stageCards.forEach(function(card) {
                                card.classList.remove('locked');
                            });
                        }

                        // Remove group badge
                        var groupBadge = column && column.querySelector('.group-locked-badge');
                        if (groupBadge) groupBadge.remove();
                    });
                }

                updateSummary();
            }

            btnDesktop.addEventListener('click', function() { applyMode('desktop'); });
            btnMobile.addEventListener('click', function() { applyMode('mobile'); });

            // ============================================
            // START DEMO
            // ============================================
            startBtn.addEventListener('click', function() {
                if (startBtn.disabled) return;

                // Read selections
                var config = {};
                DEMO_STAGES.forEach(function(stage) {
                    if (stage.multiSelect) {
                        var checked = Array.prototype.slice.call(
                            builderGrid.querySelectorAll('input[name="stage-' + stage.id + '"]:checked')
                        ).map(function(i) { return i.value; });
                        if (!checked.length) checked = stage.options.map(function(o) { return o.id; });
                        config.methods = checked;          // Paso 3 = metodos habilitados del portal
                        config[stage.id] = checked[0];     // compat: primer metodo como valor unico
                        return;
                    }
                    var selected = builderGrid.querySelector('input[name="stage-' + stage.id + '"]:checked');
                    config[stage.id] = selected ? selected.value : stage.options[0].id;
                });

                // Marca de factura (solo aplica al canal QR en Factura)
                if (config.arrival === 'qr') {
                    var facturaSel = document.getElementById('builderFacturaSelect');
                    if (facturaSel) config.factura = facturaSel.value;
                }

                // Save config for other pages to read
                saveDemoConfig(config);

                // Verificar mobileOnly — demos que siempre abren en mobile-viewer
                var arrivalOption = getOptionById('arrival', config.arrival);
                if (arrivalOption && arrivalOption.mobileOnly) {
                    window.location.href = 'mobile-viewer.html?demo=' + arrivalOption.id;
                    return;
                }

                // Navigate to the first page of the flow
                var startUrl = getDemoStartUrl(currentMode);
                if (!startUrl) {
                    alert('Esta combinacion no esta disponible en modo mobile');
                    return;
                }
                window.location.href = startUrl;
            });

            // ============================================
            // INIT
            // ============================================
            applyMode(currentMode);
            updateSummary();
            updateForcedPayment();
            updateGroupLocking();
        })();
    </script>

    <script>
        // ============================================
        // BRAND EDITOR: Visual brand editor panel
        // ============================================
        (function initBrandEditor() {
            var editor = document.getElementById('brandEditor');
            var toggle = document.getElementById('brandEditorToggle');
            var body = document.getElementById('brandEditorBody');
            var badge = document.getElementById('brandEditorBadge');

            // Helper: read BRAND['colors']['primary'] from path 'colors.primary'
            function getNestedValue(obj, path) {
                return path.split('.').reduce(function(o, key) {
                    return o && o[key] !== undefined ? o[key] : undefined;
                }, obj);
            }

            // Helper: write to BRAND['colors']['primary'] from path 'colors.primary'
            function setNestedValue(obj, path, value) {
                var keys = path.split('.');
                var target = obj;
                for (var i = 0; i < keys.length - 1; i++) {
                    if (!target[keys[i]]) target[keys[i]] = {};
                    target = target[keys[i]];
                }
                target[keys[keys.length - 1]] = value;
            }

            // Actualiza el preview + nombre del logo en el editor
            function setLogoPreview(src, name) {
                var prev = document.getElementById('brandLogoPreview');
                var nm = document.getElementById('brandLogoName');
                if (prev) {
                    prev.style.backgroundImage = src ? ('url("' + src + '")') : '';
                    prev.classList.toggle('has-img', !!src);
                }
                if (nm) nm.textContent = name || (src ? 'Imagen cargada' : 'Ninguna imagen');
            }

            // Sube el logo (data URL) al backend y devuelve la URL hosteada.
            // Por que: un data: URL vive solo en esta compu y no entra en el QR.
            // La URL hosteada SI viaja en el QR, asi el logo aparece en el celular.
            // Si el backend no esta disponible (ej. server local sin funciones),
            // se conserva el data URL: el logo se ve en esta compu pero no en el celular.
            function uploadLogo(dataUrl, fileName) {
                var logoValue = document.getElementById('brandLogoValue');
                return fetch('/api/upload-logo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ dataUrl: dataUrl })
                })
                .then(function(r) { return r.json().then(function(j) { return { ok: r.ok, j: j }; }); })
                .then(function(res) {
                    if (res.ok && res.j && res.j.url) {
                        if (logoValue) logoValue.value = res.j.url; // URL hosteada -> viaja en el QR
                        setLogoPreview(res.j.url, 'Logo hosteado ✓');
                        showToast('Logo subido — se verá también en el celular');
                    } else {
                        setLogoPreview(dataUrl, (fileName || 'Imagen') + ' (solo local)');
                        showToast('No se pudo hostear el logo: se ve acá, no en el celular');
                    }
                })
                .catch(function() {
                    setLogoPreview(dataUrl, (fileName || 'Imagen') + ' (solo local)');
                    showToast('Backend no disponible: el logo se ve acá, no en el celular');
                });
            }

            // 1. Populate inputs with current BRAND values
            function populateEditorFields() {
                var inputs = document.querySelectorAll('#brandEditorBody [data-brand]');
                inputs.forEach(function(input) {
                    var path = input.getAttribute('data-brand');
                    var value = getNestedValue(BRAND, path);
                    if (value !== undefined) {
                        input.value = value;
                    }
                });
                // Sincronizar el preview del logo con el valor actual
                var lv = document.getElementById('brandLogoValue');
                if (lv) {
                    var nm = lv.value ? (/^data:/.test(lv.value) ? 'Imagen cargada' : lv.value.split('/').pop()) : '';
                    setLogoPreview(lv.value, nm);
                }
            }

            // 2. Show/hide badge based on active overrides
            function updateBadge() {
                if (typeof BrandOverride !== 'undefined' && BrandOverride.has()) {
                    badge.style.display = '';
                } else {
                    badge.style.display = 'none';
                }
            }

            // 3. Update visible brand elements on index.html
            function refreshIndexBrand() {
                var logo = document.getElementById('indexLogo');
                if (logo) { logo.src = BRAND.logo; logo.alt = BRAND.name; }

                document.querySelectorAll('[data-brand="name"]').forEach(function(el) {
                    if (el.tagName === 'INPUT') return;
                    el.textContent = BRAND.name;
                });

                document.title = BRAND.name + ' - Demo Portal de Pagos';
            }

            // 4. Tab switching
            function setupTabs() {
                var tabsContainer = document.getElementById('brandEditorTabs');
                tabsContainer.addEventListener('click', function(e) {
                    var btn = e.target.closest('.brand-tab');
                    if (!btn) return;
                    var tabId = btn.getAttribute('data-tab');

                    // Update active tab button
                    tabsContainer.querySelectorAll('.brand-tab').forEach(function(t) {
                        t.classList.toggle('active', t === btn);
                    });

                    // Update active tab content
                    var contents = document.querySelectorAll('#brandEditorBody .brand-tab-content');
                    contents.forEach(function(c) {
                        c.classList.toggle('active', c.getAttribute('data-tab') === tabId);
                    });
                });
            }

            // 5. Live preview on input changes
            function setupLivePreview() {
                var inputs = document.querySelectorAll('#brandEditorBody [data-brand]');
                inputs.forEach(function(input) {
                    input.addEventListener('input', function() {
                        var path = input.getAttribute('data-brand');
                        var value = input.value;

                        // Convert to number for number inputs
                        if (input.type === 'number') {
                            value = parseFloat(value) || 0;
                        }

                        // Update BRAND in memory
                        setNestedValue(BRAND, path, value);

                        // Re-apply colors if a color changed
                        if (path.startsWith('colors.')) {
                            applyBrandColors();
                        }

                        // Refresh visible brand elements on index.html
                        refreshIndexBrand();
                    });
                });
            }

            // 6. Sync color picker with hex text input
            function setupColorSync() {
                var colorInputs = document.querySelectorAll('input[type="color"][data-color-for]');
                colorInputs.forEach(function(picker) {
                    var hexInputId = picker.getAttribute('data-color-for');
                    var hexInput = document.getElementById(hexInputId);
                    if (!hexInput) return;

                    // Color picker -> hex text
                    picker.addEventListener('input', function() {
                        hexInput.value = picker.value;
                        hexInput.dispatchEvent(new Event('input', { bubbles: true }));
                    });

                    // Hex text -> color picker
                    hexInput.addEventListener('input', function() {
                        if (/^#[0-9A-Fa-f]{6}$/.test(hexInput.value)) {
                            picker.value = hexInput.value;
                        }
                    });
                });
            }

            // 7. Build override object from current form values
            function buildOverridesFromInputs() {
                var overrides = {};
                var inputs = document.querySelectorAll('#brandEditorBody [data-brand]');
                var seen = {};
                inputs.forEach(function(input) {
                    var path = input.getAttribute('data-brand');
                    if (seen[path]) return;
                    seen[path] = true;

                    var value = input.value;
                    if (input.type === 'number') value = parseFloat(value) || 0;

                    setNestedValue(overrides, path, value);
                });
                return overrides;
            }

            // 8. Toast notification
            function showToast(message) {
                var toast = document.createElement('div');
                toast.className = 'brand-toast';
                toast.textContent = message;
                document.body.appendChild(toast);
                toast.offsetHeight; // trigger reflow for animation
                toast.classList.add('visible');
                setTimeout(function() {
                    toast.classList.remove('visible');
                    setTimeout(function() { toast.remove(); }, 300);
                }, 2000);
            }

            // 9. Action buttons
            function setupActions() {
                // Logo: file picker (buscar archivo en vez de escribir la ruta)
                var logoBtn = document.getElementById('brandLogoBtn');
                var logoFile = document.getElementById('brandLogoFile');
                var logoValue = document.getElementById('brandLogoValue');
                if (logoBtn && logoFile && logoValue) {
                    logoBtn.addEventListener('click', function() { logoFile.click(); });
                    logoFile.addEventListener('change', function(e) {
                        var file = e.target.files && e.target.files[0];
                        if (!file) return;
                        if (!/^image\//.test(file.type)) { showToast('Elegí una imagen (PNG, JPG o SVG)'); logoFile.value = ''; return; }
                        if (file.size > 2 * 1024 * 1024) { showToast('Imagen muy grande (máx 2MB)'); logoFile.value = ''; return; }
                        var reader = new FileReader();
                        reader.onload = function(ev) {
                            var dataUrl = ev.target.result;
                            // Preview instantaneo + guardamos el data URL provisorio
                            logoValue.value = dataUrl;
                            setLogoPreview(dataUrl, 'Subiendo…');
                            // Hostear el logo para que viaje en el QR al celular
                            uploadLogo(dataUrl, file.name);
                        };
                        reader.readAsDataURL(file);
                    });
                }

                // Save
                document.getElementById('brandSave').addEventListener('click', function() {
                    var overrides = buildOverridesFromInputs();
                    BrandOverride.save(overrides);
                    updateBadge();
                    showToast('Marca guardada');
                });

                // Reset
                document.getElementById('brandReset').addEventListener('click', function() {
                    if (!confirm('Esto eliminara todas las personalizaciones. Continuar?')) return;
                    BrandOverride.clear();
                    window.location.reload();
                });

                // Export
                document.getElementById('brandExport').addEventListener('click', function() {
                    var json = BrandOverride.export();
                    var blob = new Blob([json], { type: 'application/json' });
                    var url = URL.createObjectURL(blob);
                    var a = document.createElement('a');
                    a.href = url;
                    a.download = 'brand-config-' + BRAND.name.toLowerCase().replace(/\s+/g, '-') + '.json';
                    a.click();
                    URL.revokeObjectURL(url);
                });

                // Import trigger
                document.getElementById('brandImport').addEventListener('click', function() {
                    document.getElementById('brandImportFile').click();
                });

                // Import file handler
                document.getElementById('brandImportFile').addEventListener('change', function(e) {
                    var file = e.target.files[0];
                    if (!file) return;
                    var reader = new FileReader();
                    reader.onload = function(ev) {
                        try {
                            BrandOverride.import(ev.target.result);
                            populateEditorFields();
                            refreshIndexBrand();
                            updateBadge();
                            showToast('Marca importada: ' + BRAND.name);
                        } catch (err) {
                            alert('Error al importar: ' + err.message);
                        }
                    };
                    reader.readAsText(file);
                    e.target.value = '';
                });
            }

            // Toggle expand/collapse
            toggle.addEventListener('click', function() {
                editor.classList.toggle('open');
            });

            // 10. Preset management
            function refreshPresetSelect() {
                var select = document.getElementById('brandPresetSelect');
                var activePreset = BrandOverride.presets.getActive();
                var presets = BrandOverride.presets.list();
                var deleteBtn = document.getElementById('brandPresetDelete');

                // Limpiar opciones (excepto la default)
                while (select.options.length > 1) {
                    select.remove(1);
                }

                presets.forEach(function(preset) {
                    var option = document.createElement('option');
                    option.value = preset.name;
                    option.textContent = preset.name;
                    if (preset.name === activePreset) option.selected = true;
                    select.appendChild(option);
                });

                // Mostrar boton eliminar solo si hay un preset activo seleccionado
                deleteBtn.style.display = activePreset ? '' : 'none';
            }

            function setupPresets() {
                // Cambiar de preset
                document.getElementById('brandPresetSelect').addEventListener('change', function() {
                    var selectedName = this.value;

                    if (!selectedName) {
                        // Volver a default
                        BrandOverride.clear();
                        try { localStorage.removeItem('brandActivePreset'); } catch (e) {}
                        window.location.reload();
                        return;
                    }

                    BrandOverride.presets.activate(selectedName);
                    window.location.reload();
                });

                // Guardar como preset nuevo
                document.getElementById('brandPresetSaveAs').addEventListener('click', function() {
                    var name = prompt('Nombre del preset:');
                    if (!name || !name.trim()) return;
                    name = name.trim();

                    // Construir overrides desde los inputs actuales del editor
                    var overrides = buildOverridesFromInputs();

                    // Guardar el preset
                    BrandOverride.presets.save(name, overrides);

                    // Tambien activarlo y guardar como override actual
                    BrandOverride.save(overrides);
                    try { localStorage.setItem('brandActivePreset', name); } catch (e) {}

                    refreshPresetSelect();
                    updateBadge();
                    showToast('Preset "' + name + '" guardado');
                });

                // Eliminar preset
                document.getElementById('brandPresetDelete').addEventListener('click', function() {
                    var activePreset = BrandOverride.presets.getActive();
                    if (!activePreset) return;
                    if (!confirm('Eliminar el preset "' + activePreset + '"?')) return;

                    BrandOverride.presets.delete(activePreset);
                    BrandOverride.clear();
                    window.location.reload();
                });
            }

            // Initialize
            populateEditorFields();
            updateBadge();
            setupTabs();
            setupLivePreview();
            setupColorSync();
            setupActions();
            setupPresets();
            refreshPresetSelect();
        })();
    </script>
